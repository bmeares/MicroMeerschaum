[package]
name = "micro"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
description = "Meerschaum device instances, actions and durable batch receiver for MicroMeerschaum"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meerschaum-plugin = "=5.1.5"
micromeerschaum = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
reedline = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
[profile.release]
strip = true
